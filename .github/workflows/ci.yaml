name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          rm -rf lib/chainlink
          rm -rf lib/forge-std
          forge install foundry-rs/forge-std --no-commit
          forge install smartcontractkit/functions-framework --no-commit
          ls -R lib/chainlink/comtracts/src/v0.8

      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

