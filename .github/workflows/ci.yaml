name: Build, Test and Depeoy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
          RPC_URL: https://sepolia.base.org  
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          rm -rf lib/chainlink
          rm -rf lib/forge-std
          
      - name: Install node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

          
      - name: Create basic package json if missing
        working-directory: ./frontend
        run: |
          if [ ! -f package.json ]; then
            echo "package json not found -> running npm init -y"
            npm init -y
            jq '. + {
              "private": true,
              "scripts": {
                "start": "node index.js",
                "test": "echo \"Error: no test specified\" && exit 1"
              },
              "dependencies": {
              }
            }' package.json > tmp.json && mv tmp.json package.json
          else
            echo "package.json already exists + skipping creation"
          fi

             
      - name: Install chainlink contracts via npm
        run: npm install @chainlink/contracts --no-save --no-package-lock

      - name: Symlink for foundry
        run: |
          mkdir -p lib/chainlink/contracts
          ln -s $(pwd)/node_modules/@chainlink/contracts lib/chainlink/contracts
          
      - name: Debug chainlink install
        run: |
          ls -la lib/chainlink/contracts/src/v0.8/functions/ || echo "Functions dir missing"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/ || echo "v1_0_0 missing"
          cat lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol 2>/dev/null || echo "File not found"


      - name: Commit package.json, package-lock.json & node_modules (if changed)
        run: |
          git config user.name "Github Actions Bot"
          git config user.email "actions@github.com"

          [ -f frontend/package.json ] && git add -f frontend/package.json || true
          [ -f frontend/package-lock.json ] && git add frontend/package-lock.json || true

          git diff --cached --quiet || git commit -m "chore(deps): bootstrap package.json + install node_modules [ci skip]"
          git push origin HEAD:${{ github.ref_name }} || echo "push skipped (no changes or already up to date)"
          ls -la frontend/package.json || "package.json missing"
          ls -la frontend/package-lock.json || "package lock json missing"

 
      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes

      - name: Show out/ directory structure build
        run: |
          ls -la out/ || echo "out/ folder missing completely!"
          find out/ -type f -name "*.json" || echo "No .json files found"


      - name: Run tests
        run: forge test -vvv

      - name: Generate ABI for frontend
        #working-directory: ./contracts
        run: jq '.abi' out/ParametricCropInsurance.sol/ParametricCropInsurance.json > ../../abi.json

      - name: Install Playwright and dependencis
        working-directory: ./frontend
        run: |
          npm install --save-dev @playwright/test serve
          npx playwright install --with-deps chromium

      - name: Create Paywright config & test file if missing
        working-directory: ./frontend
        run: |
          cat > playwright.config.js << 'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir:'.',
            testMatch: ['connect.spec.js'],
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: 'html',
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome']},
                },
              ],
            use: {
              baseURL: 'http://localhost:3000',
              trace: 'on-first-retry',
            },
            webServer: {
              command: 'npx serve . -p 3000 --no-port-switching',
              port: 3000,
              reuseExistingServer: !process.env.CI,
            },
          });
          EOF

          cat > connect.spec.js << 'EOF'
          const { test, expect } = require('@playwright/test');

          test('Connect Wallet button works', async ({ page }) => {
            const logs = [];
            page.on('console', msg => {
              const text = `${msg.type()}: ${msg.text()}`;
              logs.push(text);
              console.log(`[BROWSER] ${text}`);
              });

            page.on('pageerror', err => {
              console.error(`[PAGE ERROR] ${err.message}`);
              });

            await page.route('**/*', async (route) => {
              const url = route.request().url();
              if(url.includes('rpc.sepolia.org') || url.includes('etherscan') || url.includes('cdn')){
                console.log(`Blocked external: ${url}`);
                return route.abort();
              }
              return route.continue();
            });

            await page.addInitScript(() => {
            window.ethereum = {
              request: async (args) => {

                console.log('args method', args.method);

                if (args.method === 'eth_requestAccounts') {
                  return ['0xMockedTestAddress1234567890'];
                  }
                if (args.method === 'eth_chainId'){
                  return '0xaa36a7';
                }
                console.log('Mock: unsupported method ' , args.method);
                throw new Error('Mock: unsupported method ' + args.method );
                },
                isMetaMask: true,
              };
            });
            await page.goto('/web/index.html');

            await page.getByRole('button', { name: 'Connect Wallet (metaMask)' }).click();
            await expect(page.locator('#status')).toHaveText('Connected');
            
            });
          EOF
         

      - name: Download ether js for testing
        working-directory: ./frontend
        run: |
          mkdir -p web
          curl -L -o web/ethers-5.7.umd.min.js https://cdn.ethers.io/lib/ethers-5.7.umd.min.js
      - name: Run playwright tests
        working-directory: ./frontend
        run: npx playwright test --project=chromium
      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Deploy 
        run: |
          forge script contracts/script/DeployInsurance.s.sol:DeployInsurance \
            --rpc-url $RPC_URL \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.POLYGONSCAN_API_KEY }} \

  frontend-checks:
    needs: build-test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
#          cache: 'npm'
#          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm run typecheck || echo "TRypecheckassed or no scripr defined"
    
      - name: Install dependencies for eas
        working-directory: ./frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npx expo install --fix

#      - name: Set up android and fix gradle
#        working-directory: ./frontend
#        run: |
#          npx expo prebuild --platform android --non-interactive
#          git config user.name "Github Actions Bot"
#          git config user.email "actions@github.com"
#          git add android
#          git commit -m "chore(deps): adding android folder in one time step  [ci skip]"
#          git push origin HEAD:${{ github.ref_name }} || echo "push skipped (no changes or already up to date)"


      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}


      - name: Set up environment variables for signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: echo "Credentials ready (passwords set via env)"


      - name: Install JDK for keytool
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Generate random keystore password and alias
        id: generate-secrets
        working-directory: ./frontend
        run: |
          RANDOM_PASS=$(cat /dev/urandom | tr -dc 'A-Za-z0-9!@#$%^&' | head -c 40)
          RANDOM_ALIAS="ci-$(date + %s)-$(cat /dev/urandom | tr -dc 'a-z0-9' | head -c 8)"
          echo "add-mask::$RANDOM_PASS"
          echo "::add-mask::$RANDOM_ALIAS"
          echo "keystore_pass=$RANDOM_PASS" >> $GITHUB_OUTPUT
          echo "key_alias=$RANDOM_ALIAS" >> $GITHUB_OUTPUT
      - name: Generate keystore if missing
        working-directory: ./frontend
        env:
          KEYSTORE_PASS: ${{ steps.generate-secrets.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.generate-secrets.outputs.key_alias }}
        run: |
          KEYSTORE_PATH="android/release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -keystore android/release.jks \
              -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" \
              -dname "CN=com.mranjan7.parametriccropinsurance"
          fi
      - name: Lint (if configured)
        working-directory: ./frontend
        run: npm run lint || echo "lint passed or no script defined" 


      - name: Generate credentials json for local signing
        working-directory: ./frontend
        env:
          KEYSTORE_PASS: ${{ steps.generate-secrets.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.generate-secrets.outputs.key_alias }}
        run: |
          echo '{
          "android": {
            "keystore": {
              "keystorePath": "android/release.jks",
              "keystorePassword":"$KEYSTORE_PASS",
              "keyAlias":"$KEY_ALIAS",
              "keyPassword":"$KEYSTORE_PASS"
              }
            }
          }' > credentials.json
          ls -la credentials.json
          grep -A 5 "keystore" credentials.json || echo "JSOn snippet not found"
          echo "credentials.json generated (size: $(stat -c%s credentials.json) bytes)"


#      - name: EAS Build(Andoid production)
#        working-directory: ./frontend
#        run: |
#          rm -rf node_modules .expo .cache
#          npm install --save-dev expo
#          npx expo install expo-updates
#          eas build --platform android --profile production --non-interactive --no-wait
      - name: EAS Build(IOS production)
        working-directory: ./frontend
        run: |
          eas build --platform ios --profile production --non-interactive --no-wait
