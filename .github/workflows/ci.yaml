name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          rm -rf lib/chainlink
          rm -rf lib/forge-std
          forge install foundry-rs/forge-std
          forge install smartcontractkit/chainlink
          forge remappings

      - name: Debug chainlink install
        run: |
          ls -la lib/chainlink/contracts/src/v0.8/functions/ || echo "Functions dir missing"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/ || echo "v1_0_0 missing"
        cat lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol 2>/dev/null || echo "File not found"

      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

