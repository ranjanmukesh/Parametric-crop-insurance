name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          rm -rf lib/chainlink
          rm -rf lib/forge-std
          
      - name: Install node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

          
      - name: Create basic package json if missing
        working-directory: ./frontend
        run: |
          if [ ! -f package.json ]; then
            echo "package json not found -> running npm init -y"
            npm init -y
            jq '. + {
              "private": true,
              "scripts": {
                "start": "node index.js",
                "test": "echo \"Error: no test specified\" && exit 1"
              },
              "dependencies": {
              }
            }' package.json > tmp.json && mv tmp.json package.json
          else
            echo "package.json already exists + skipping creation"
          fi

             
      - name: Install chainlink contracts via npm
        run: npm install @chainlink/contracts --no-save --no-package-lock

      - name: Symlink for foundry
        run: |
          mkdir -p lib/chainlink/contracts
          ln -s $(pwd)/node_modules/@chainlink/contracts lib/chainlink/contracts
          
      - name: Debug chainlink install
        run: |
          ls -la lib/chainlink/contracts/src/v0.8/functions/ || echo "Functions dir missing"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/ || echo "v1_0_0 missing"
          cat lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol 2>/dev/null || echo "File not found"


      - name: Commit package.json, package-lock.json & node_modules (if changed)
        run: |
          git config user.name "Github Actions Bot"
          git config user.email "actions@github.com"

          [ -f frontend/package.json ] && git add -f frontend/package.json || true
          [ -f frontend/package-lock.json ] && git add frontend/package-lock.json || true

          git diff --cached --quiet || git commit -m "chore(deps): bootstrap package.json + install node_modules [ci skip]"
          git push origin HEAD:${{ github.ref_name }} || echo "push skipped (no changes or already up to date)"
          ls -la frontend/package.json || "package.json missing"
          ls -la frontend/package-lock.json || "package lock json missing"

 
      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes

      - name: Show out/ directory structure build
        run: |
          ls -la out/ || echo "out/ folder missing completely!"
          find out/ -type f -name "*.json" || echo "No .json files found"


      - name: Run tests
        run: forge test -vvv

      - name: Generate ABI for frontend
        #working-directory: ./contracts
        run: jq '.abi' out/ParametricCropInsurance.sol/ParametricCropInsurance.json > ../../abi.json
  frontend-checks:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
#          cache: 'npm'
#          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm run typecheck || echo "TRypecheckassed or no scripr defined"
    
      - name: Install dependencies for eas
        working-directory: ./frontend
        run: npm install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Android keystore from secret
        env: 
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" ? base64 --decode > android/release.keystore
          ls -la android/
      - name: Set up environment variables for signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: echo "Credentials ready (passwords set via env)"

      - name: Write signing config to gradle.properties
        run: |
          cat >> android/gradle.properties << EOF
          android.useAndroidX=true
          android.enableJetifier=true
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          EOF

      - name: Lint (if configured)
        working-directory: ./frontend
        run: npm run lint || echo "lint passed or no script defined" 


      - name: EAS Build(Andoid production)
#        uses: expo/expo-github-action@v8
#        with:
#          eas-version: latest
#          token: ${{ secrets.EXPO_TOKEN }}
        working-directory: ./frontend
        run: eas build --platform android --profile production --non-interactive

      - name: Trigger iOS build
        working-directory: ./frontend
        run: eas build --platform ios --profile preview --non-intercative --no-wait

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://sepolia.base.org  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundary
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

#      - name: Install dependencies
#        run: |
#          rm -rf lib/chainlink
#          rm -rf lib/forge-std
          
      - name: Install node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install chainlink contracts via npm
        run: npm install @chainlink/contracts

      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes


 

      - name: Deploy 
        run: |
          forge script contracts/script/DeployInsurance.s.sol:DeployInsurance \
            --rpc-url $RPC_URL \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.POLYGONSCAN_API_KEY }} \
