name: Build, Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          rm -rf lib/chainlink
          rm -rf lib/forge-std
          
      - name: Install node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

          
      - name: Create basic package json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package json not found -> running npm init -y"
            npm init -y
            jq '. + {
              "private": true,
              "scripts": {
                "start": "node index.js",
                "test": "echo \"Error: no test specified\" && exit 1"
              },
              "dependencies": {
              }
            }' package.json > tmp.json && mv tmp.json package.json
          else
            echo "package.json already exists + skipping creation"
          fi

      - name: Commit package.json, package-lock.json & node_modules (if changed)
        run: |
          git config user.name "Github Actions Bot"
          git config user.email "actions@github.com"

          [ -f package.json ] && git add -f package.json || true
          [ -f package-lock.json ] && git add package-lock.json || true

          git diff --cached --quiet || git commit -m "chore(deps): bootstrap package.json + install node_modules [ci skip]"
          git push origin HEAD:${{ github.ref_name }} || echo "push skipped (no changes or already up to date)"
              
      - name: Install chainlink contracts via npm
        run: npm install @chainlink/contracts
          
      - name: Install tree and run command
        run: |
          sudo apt-get update && sudo apt-get install -y tree
          tree -L 5 node_modules/@chainlink/contracts/src/

      - name: Debug chainlink install
        run: |
          ls -la lib/chainlink/contracts/src/v0.8/functions/ || echo "Functions dir missing"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/ || echo "v1_0_0 missing"
          cat lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol 2>/dev/null || echo "File not found"

      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes

      - name: Show out/ directory structure build
        run: |
          ls -la out/ || echo "out/ folder missing completely!"
          tree out/ -L 3 || "tree failed - folder empty or missing"
          find out/ -type f -name "*.json" || echo "No .json files found"


      - name: Run tests
        run: forge test -vvv

      - name: Generate ABI for frontend
        #working-directory: ./contracts
        run: jq '.abi' out/ParametricCropInsurance.sol/ParametricCropInsurance.json > ../../abi.json
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm run typecheck || echo "TRypecheckassed or no scripr defined"


      - name: Lint (if configured)
        working-directory: ./frontend
        run: npm run lint || echo "lint passed or no script defined"

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://sepolia.base.org  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundary
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

#      - name: Install dependencies
#        run: |
#          rm -rf lib/chainlink
#          rm -rf lib/forge-std
          
      - name: Install node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install chainlink contracts via npm
        run: npm install @chainlink/contracts

      - name: Clean
        run: forge clean

      - name: Build contracts
        run: forge build --sizes


 

      - name: Deploy 
        run: |
          forge script contracts/script/DeployInsurance.s.sol:DeployInsurance \
            --rpc-url $RPC_URL \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.POLYGONSCAN_API_KEY }} \
