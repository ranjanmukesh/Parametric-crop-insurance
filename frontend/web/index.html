<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect MetaMask with Ethers.js</title>
    <!-- Load Ethers.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
</head>
<body>

		<!-- Company Logo -->
		<div style="text-align: center; padding: 20px 0;">
				<img src="Paramora_logo.png" 
						 alt="Company Logo" 
						 style="max-width: 200px; height: auto;">
</div>
    <h1>Paramora</h1>
    
    <button onclick="connectWallet()">Connect Wallet</button>
    
    <p id="account"></p>
    <p id="network"></p>
    <p id="balance"></p>


<!-- Dropdown for Protection Level -->
<label for="package">Choose Protection Level:</label>
<select id="package" onchange="selectPackage()">
  <option value="">-- Select Package --</option>
  <option value="low">Low Protection</option>
  <option value="medium">Medium Protection (Most Popular)</option>
  <option value="high">High Protection</option>
</select>

<!-- Hidden Form that appears after selection -->
<div id="formSection" style="display: none; margin-top: 20px;">
  <h3 id="packageTitle">Selected Package</h3>

  <label>Coverage Amount (ETH) - Payout if triggered</label>
  <input type="text" id="coverage" readonly>

  <label>Rainfall Threshold (mm) - Trigger for payout</label>
  <input type="text" id="threshold" readonly>

  <label>Season Start Date (YYYY-MM-DD)</label>
  <input type="text" id="startDate" value="2026-06-01">

  <label>Season End Date (YYYY-MM-DD)</label>
  <input type="text" id="endDate" value="2026-09-30">

  <label>Premium to Pay (ETH) - Minimum 10% of Coverage</label>
  <input type="number" id="premium" step="0.01" min="0.05">

  <button onclick="buyPolicy()">Buy Policy Now</button>
</div>

    <script>
        let provider;
        let signer;

        async function connectWallet() {
            if (typeof window.ethereum !== "undefined") {
                try {
                    // Create provider from MetaMask
                    provider = new ethers.BrowserProvider(window.ethereum);
                    
                    // Request connection
                    await provider.send("eth_requestAccounts", []);
                    
                    // Get signer and account
                    signer = await provider.getSigner();
                    alert('signer'+signer);
                    const address = await signer.getAddress();

                    document.getElementById("account").innerHTML = 
                        `<strong>Connected Account:</strong> ${address}`;

                    // Get network
                    const network = await provider.getNetwork();
                    document.getElementById("network").innerHTML = 
                        `<strong>Network:</strong> ${network.name} (Chain ID: ${network.chainId})`;

                    // Get balance
                    const balance = await provider.getBalance(address);
                    const ethBalance = ethers.formatEther(balance);
                    document.getElementById("balance").innerHTML = 
                        `<strong>Balance:</strong> ${ethBalance} ETH`;

                    console.log("Connected with Ethers.js:", address);

                } catch (error) {
                    console.error(error);
                    alert("Connection failed or was rejected."+error);
                }
            } else {
                alert("MetaMask is not installed!");
            }
        }

        // Optional: Listen for account changes
        if (typeof window.ethereum !== "undefined") {
            window.ethereum.on("accountsChanged", () => {
                connectWallet(); // Re-connect to update UI
            });
        }
let selectedCoverage = 1.0;
let selectedThreshold = 50;

function selectPackage(level) {
  document.getElementById('selectedPackage').style.display = 'block';
  
  if (level === 'low') {
    selectedCoverage = 0.5; selectedThreshold = 60;
    document.getElementById('packageName').innerText = 'Low Protection';
  } else if (level === 'medium') {
    selectedCoverage = 1.0; selectedThreshold = 50;
    document.getElementById('packageName').innerText = 'Medium Protection';
  } else if (level === 'high') {
    selectedCoverage = 2.0; selectedThreshold = 40;
    document.getElementById('packageName').innerText = 'High Protection';
  }

  document.getElementById('coverage').value = selectedCoverage;
  document.getElementById('threshold').value = selectedThreshold;
  document.getElementById('premium').value = (selectedCoverage * 0.10).toFixed(2); // min 10%
}
    </script>

</body>
</html>
