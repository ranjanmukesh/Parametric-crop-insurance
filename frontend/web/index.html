<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to MetaMask</title>
</head>
<body>

    <h1>Connect to MetaMask</h1>
    
    <button onclick="connectWallet()">Connect Wallet</button>
    
    <p id="account"></p>
    <p id="network"></p>

    <script>
        async function connectWallet() {
            if (typeof window.ethereum !== "undefined") {
                try {
                    // Request account access
                    const accounts = await ethereum.request({ method: "eth_requestAccounts" });
                    const account = accounts[0];

                    document.getElementById("account").innerHTML = 
                        `<strong>Connected Account:</strong> ${account}`;

                    // Get current network
                    const chainId = await ethereum.request({ method: "eth_chainId" });
                    document.getElementById("network").innerHTML = 
                        `<strong>Network ID:</strong> ${parseInt(chainId, 16)}`;

                    console.log("Connected:", account);

                } catch (error) {
                    console.error(error);
                    alert("User rejected the connection.");
                }
            } else {
                alert("MetaMask is not installed. Please install MetaMask!");
            }
        }

        // Optional: Listen for account changes
        if (typeof window.ethereum !== "undefined") {
            ethereum.on("accountsChanged", (accounts) => {
                if (accounts.length > 0) {
                    document.getElementById("account").innerHTML = 
                        `<strong>Connected Account:</strong> ${accounts[0]}`;
                } else {
                    document.getElementById("account").innerHTML = "Wallet disconnected";
                }
            });
        }
    </script>

</body>
</html>
